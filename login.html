<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Discord...</title>
    <style>
        body { background: #020203; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .loader { border: 4px solid #1a1a1a; border-top: 4px solid #00e5ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader" style="margin: 0 auto 20px;"></div>
        <p>Redirecting to Discord...</p>
    </div>

    <script>
        // KONFIGURACJA
        const CLIENT_ID = 'TWOJE_CLIENT_ID';
        const REDIRECT_URI = 'https://twojadomena.pl/auth/discord/callback'; // Musi być HTTPS i zgodne z ustawieniami w Discord Developer Portal
        const SCOPES = 'identify email guilds.join'; // Potrzebujemy emaila i możliwości dodania do serwera

        // Automatyczne przekierowanie
        const authUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&scope=${encodeURIComponent(SCOPES)}`;
        
        window.location.href = authUrl;
    </script>
</body>
</html>
