<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archnemesis — User Panel</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root{--accent:#00e5ff;--accent-hover:#00b8cc;--radius:10px;--transition:.3s ease;--font:'Segoe UI',system-ui,sans-serif}
[data-theme="dark"]{--bg-overlay:rgba(2,2,3,0.85);--surface-tile-1:rgba(255,255,255,0.03);--surface-tile-2:rgba(0,0,0,0.5);--border:rgba(0,229,255,0.15);--text:#fff;--text-dim:#8a93a6;--glow:rgba(0,229,255,0.25);--nav-bg:rgba(2,2,3,0.8);--btn-text:#000}
[data-theme="light"]{--bg-overlay:rgba(244,247,249,0.85);--surface-tile-1:rgba(255,255,255,0.8);--surface-tile-2:rgba(0,0,0,0.05);--border:rgba(0,0,0,0.1);--text:#0f172a;--text-dim:#64748b;--glow:rgba(0,153,204,0.25);--nav-bg:rgba(244,247,249,0.85);--btn-text:#000;--accent:#0099cc;--accent-hover:#007aa3}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;background-image:linear-gradient(var(--bg-overlay),var(--bg-overlay)),url('wallpaper.png');background-size:cover;background-position:center;background-attachment:fixed;background-color:#020203;transition:color var(--transition)}
.container{width:100%;max-width:1000px;position:relative;z-index:1}

/* Tabs */
.tabs{display:flex;gap:10px;margin-bottom:20px;justify-content:center;flex-wrap:wrap}
.tab-btn{padding:12px 24px;background:var(--surface-tile-1);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:1px;transition:all .3s}
.tab-btn.active{background:var(--accent);color:var(--btn-text);border-color:var(--accent);box-shadow:0 0 15px var(--glow)}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Profile Card */
.profile-card{padding:40px;background:linear-gradient(135deg,var(--surface-tile-1) 0%,var(--surface-tile-2) 100%);backdrop-filter:blur(15px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,0.6);text-align:center;max-width:600px;margin:0 auto}
.avatar{width:110px;height:110px;border-radius:50%;border:3px solid var(--accent);margin:0 auto 16px;display:block;object-fit:cover;box-shadow:0 0 25px var(--glow)}
.username{font-size:26px;font-weight:900;margin-bottom:4px}
.userid{color:var(--text-dim);font-size:13px;letter-spacing:1px;margin-bottom:28px;text-transform:uppercase}
.info-section{text-align:left;margin-bottom:28px;padding:20px;border-radius:8px;background:rgba(0,0,0,0.2);border:1px solid var(--border)}
.info-row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,0.05)}
.info-row:last-child{border-bottom:none;padding-bottom:0}
.info-row:first-child{padding-top:0}
.info-label{color:var(--text-dim);font-weight:600}
.info-value{color:var(--text);font-weight:700}
.roles-title{font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:16px;text-align:left;font-weight:800}
.roles-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-start}
.role-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:800;text-transform:uppercase;background:rgba(255,255,255,0.05);border:1px solid var(--border);transition:all var(--transition)}
.role-badge:hover{transform:translateY(-2px);box-shadow:0 0 15px var(--glow)}
.role-dot{width:10px;height:10px;border-radius:50%}

/* Admin Panel */
.admin-card{padding:30px;background:linear-gradient(135deg,var(--surface-tile-1) 0%,var(--surface-tile-2) 100%);backdrop-filter:blur(15px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.admin-card h2{text-align:center;color:var(--accent);margin-bottom:24px;text-transform:uppercase;letter-spacing:2px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:20px}
.admin-section{padding:20px;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:8px}
.admin-section h3{color:var(--text);margin-bottom:12px;font-size:15px;border-bottom:1px solid var(--border);padding-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.admin-section input,.admin-section textarea,.admin-section select{width:100%;padding:10px;margin-bottom:8px;background:rgba(0,0,0,0.5);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:inherit;font-size:13px}
.admin-section button{width:100%;padding:10px;background:var(--accent);color:var(--btn-text);border:none;border-radius:5px;font-weight:800;cursor:pointer;transition:all .3s;text-transform:uppercase;letter-spacing:1px;font-size:12px;margin-bottom:5px}
.admin-section button:hover{background:#fff;box-shadow:0 0 15px var(--glow)}
.admin-section button.danger{background:#ff4444;color:#fff}
.admin-section button.danger:hover{background:#ff6666}
.admin-section button.warning{background:#ffaa00;color:#000}

.btn-logout{display:block;width:100%;margin-top:24px;padding:16px;background:rgba(255,255,255,0.05);color:var(--text);border:1px solid var(--border);border-radius:6px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;text-decoration:none;transition:all var(--transition);text-align:center}
.btn-logout:hover{background:var(--accent);color:var(--btn-text);border-color:var(--accent);box-shadow:0 0 25px var(--glow)}
pre#resultBox{margin-top:20px;padding:15px;background:rgba(0,0,0,0.6);border:1px solid var(--border);border-radius:8px;font-size:12px;color:#00ffaa;max-height:250px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;display:none}
</style>
</head>
<body>

<div class="container">
    <div class="tabs" id="tabs" style="display:none;">
        <button class="tab-btn active" id="tabBtnProfile" onclick="switchTab('profile', this)">Profile</button>
        <button class="tab-btn" id="tabBtnAdmin" onclick="switchTab('admin', this)" style="display:none;">Admin Panel</button>
    </div>

    <!-- PROFILE TAB -->
    <div id="profileTab" class="tab-content active">
        <div class="profile-card" id="profileCard">
            <img id="avatar" class="avatar" src="" alt="Avatar">
            <div id="username" class="username">Loading...</div>
            <div id="userid" class="userid"></div>
            <div class="info-section">
                <div class="info-row"><span class="info-label">Email</span><span class="info-value" id="email"></span></div>
                <div class="info-row"><span class="info-label">Account Created</span><span class="info-value" id="createdAt"></span></div>
                <div class="info-row"><span class="info-label">Guild ID</span><span class="info-value" id="guildId"></span></div>
            </div>
            <div class="roles-title">Your Roles</div>
            <div class="roles-grid" id="rolesGrid"></div>
            <a href="index.html" class="btn-logout">Logout / Return Home</a>
        </div>
    </div>

    <!-- ADMIN TAB -->
    <div id="adminTab" class="tab-content">
        <div class="admin-card">
            <h2>Admin Control Center</h2>
            <div class="admin-grid">
                
                <!-- MODERATION -->
                <div class="admin-section">
                    <h3>Moderation</h3>
                    <input type="text" id="modUserId" placeholder="User ID">
                    <input type="text" id="modReason" placeholder="Reason">
                    <button onclick="adminAction('ban', {userId: val('modUserId'), reason: val('modReason')})" class="danger">Ban User</button>
                    <button onclick="adminAction('kick', {userId: val('modUserId'), reason: val('modReason')})" class="warning">Kick User</button>
                    <button onclick="adminAction('timeout', {userId: val('modUserId'), duration: 600000})" class="warning">Timeout 10m</button>
                    <button onclick="adminAction('unban', {userId: val('modUserId')})">Unban User</button>
                </div>

                <!-- MESSAGING -->
                <div class="admin-section">
                    <h3>Messaging</h3>
                    <input type="text" id="dmUserId" placeholder="User ID (DM)">
                    <textarea id="dmMessage" placeholder="Message" rows="2"></textarea>
                    <button onclick="adminAction('dm', {userId: val('dmUserId'), message: val('dmMessage')})">Send DM</button>
                    <hr style="border-color:var(--border);margin:10px 0">
                    <input type="text" id="sayChannelId" placeholder="Channel ID">
                    <textarea id="sayMessage" placeholder="Message" rows="2"></textarea>
                    <button onclick="adminAction('say', {channelId: val('sayChannelId'), message: val('sayMessage')})">Send to Channel</button>
                </div>

                <!-- ROLES -->
                <div class="admin-section">
                    <h3>Role Management</h3>
                    <input type="text" id="roleUserId" placeholder="User ID">
                    <input type="text" id="roleRoleId" placeholder="Role ID">
                    <button onclick="adminAction('add_role', {userId: val('roleUserId'), roleId: val('roleRoleId')})">Add Role</button>
                    <button onclick="adminAction('remove_role', {userId: val('roleUserId'), roleId: val('roleRoleId')})" class="danger">Remove Role</button>
                </div>

                <!-- CHANNELS -->
                <div class="admin-section">
                    <h3>Channel Management</h3>
                    <input type="text" id="newChannelName" placeholder="New Channel Name">
                    <button onclick="adminAction('create_channel', {name: val('newChannelName')})">Create Channel</button>
                    <input type="text" id="delChannelId" placeholder="Channel ID to Delete">
                    <button onclick="adminAction('delete_channel', {channelId: val('delChannelId')})" class="danger">Delete Channel</button>
                </div>

                <!-- SERVER INFO -->
                <div class="admin-section">
                    <h3>Server Info</h3>
                    <button onclick="adminAction('get_guild', {})">Get Guild Info</button>
                    <button onclick="adminAction('get_roles', {})">List Roles</button>
                    <button onclick="adminAction('get_channels', {})">List Channels</button>
                    <button onclick="adminAction('get_bans', {})">List Bans</button>
                </div>

            </div>
            <pre id="resultBox"></pre>
            <a href="index.html" class="btn-logout">Logout / Return Home</a>
        </div>
    </div>
</div>

<script>
// ===== KONFIGURACJA =====
const ADMIN_ROLE_ID = '1534494523768569897'; // ID roli administratora
const ADMIN_API_KEY = 'super-secret-key';    // MUSI BYĆ TAKI SAM JAK W VERCEL!

// ===== SETUP =====
document.documentElement.setAttribute('data-theme', localStorage.getItem('arch-theme') || 'dark');
const params = new URLSearchParams(window.location.search);
const dataBase64 = params.get('data');

function val(id) { return document.getElementById(id).value; }

if (dataBase64) {
    try {
        const profile = JSON.parse(atob(dataBase64));
        
        // Wypełnij profil
        document.getElementById('avatar').src = profile.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png';
        document.getElementById('username').textContent = profile.globalName;
        document.getElementById('userid').textContent = `ID: ${profile.id}`;
        document.getElementById('email').textContent = profile.email;
        document.getElementById('createdAt').textContent = profile.createdAt;
        document.getElementById('guildId').textContent = profile.guildId;

        const rolesGrid = document.getElementById('rolesGrid');
        if (profile.roles && profile.roles.length > 0) {
            profile.roles.forEach(role => {
                const hexColor = role.color === 0 ? '#8a93a6' : `#${role.color.toString(16).padStart(6, '0')}`;
                const badge = document.createElement('div');
                badge.className = 'role-badge';
                badge.style.borderColor = hexColor;
                badge.style.color = hexColor;
                const dot = document.createElement('div');
                dot.className = 'role-dot';
                dot.style.backgroundColor = hexColor;
                badge.appendChild(dot);
                badge.appendChild(document.createTextNode(role.name));
                rolesGrid.appendChild(badge);
            });
        } else {
            rolesGrid.innerHTML = '<span style="color:var(--text-dim);font-size:14px;">No roles.</span>';
        }

        document.getElementById('tabs').style.display = 'flex';
        document.getElementById('profileCard').style.display = 'block';

        // Sprawdź, czy ma rolę admina (po ID!)
        const isAdmin = profile.roles.some(r => r.id === ADMIN_ROLE_ID);
        if (isAdmin) {
            document.getElementById('tabBtnAdmin').style.display = 'block';
        }

    } catch (e) {
        document.body.innerHTML = '<h1 style="color:#ff4444;text-align:center;">Error reading profile data.</h1>';
    }
} else {
    document.body.innerHTML = '<h1 style="color:#ff4444;text-align:center;">No login data. <a href="login.html" style="color:#00e5ff;">Login here</a>.</h1>';
}

// ===== TABS =====
function switchTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(name + 'Tab').classList.add('active');
    btn.classList.add('active');
}

// ===== API CALL =====
async function adminAction(action, params) {
    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';
    resultBox.textContent = `[${action}] Processing...`;

    try {
        const res = await fetch('/api/bot/admin_bot', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-api-key': ADMIN_API_KEY
            },
            body: JSON.stringify({ action, ...params })
        });
        const data = await res.json();
        resultBox.textContent = `[${action}] Result:\n` + JSON.stringify(data, null, 2);
    } catch (err) {
        resultBox.textContent = `[${action}] Error: ` + err.message;
    }
}
</script>
</body>
</html>
