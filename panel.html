<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archnemesis — User Panel</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root{--accent:#00e5ff;--radius:8px;--font:'Segoe UI',system-ui,sans-serif;--transition:.3s ease}
[data-theme="dark"]{--bg-overlay:rgba(2,2,3,0.85);--surface-tile-1:rgba(255,255,255,0.03);--surface-tile-2:rgba(0,0,0,0.5);--border:rgba(0,229,255,0.15);--text:#fff;--text-dim:#8a93a6;--glow:rgba(0,229,255,0.25);--input-bg:rgba(0,0,0,0.4)}
[data-theme="light"]{--bg-overlay:rgba(244,247,249,0.85);--surface-tile-1:rgba(255,255,255,0.8);--surface-tile-2:rgba(0,0,0,0.05);--border:rgba(0,0,0,0.1);--text:#0f172a;--text-dim:#64748b;--glow:rgba(0,153,204,0.25);--input-bg:rgba(255,255,255,0.8);--accent:#0099cc}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;background-image:linear-gradient(var(--bg-overlay),var(--bg-overlay)),url('wallpaper.png');background-size:cover;background-position:center;background-attachment:fixed;background-color:#020203;transition:color var(--transition)}
.container{width:100%;max-width:1100px;position:relative;z-index:1}

/* Tabs */
.tabs{display:flex;gap:10px;margin-bottom:20px;justify-content:center;flex-wrap:wrap}
.tab-btn{padding:12px 24px;background:var(--surface-tile-1);border:1px solid var(--border);color:var(--text-dim);border-radius:6px;cursor:pointer;font-weight:700;text-transform:uppercase;transition:all .3s}
.tab-btn.active{background:var(--accent);color:#000;border-color:var(--accent);box-shadow:0 0 15px var(--glow)}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{padding:30px;background:linear-gradient(135deg,var(--surface-tile-1) 0%,var(--surface-tile-2) 100%);backdrop-filter:blur(15px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.profile-card{max-width:500px;margin:0 auto;text-align:center}
.avatar{width:100px;height:100px;border-radius:50%;border:3px solid var(--accent);margin:0 auto 15px;display:block;object-fit:cover;box-shadow:0 0 25px var(--glow)}
.username{font-size:24px;font-weight:900;margin-bottom:5px}
.userid{color:var(--text-dim);font-size:12px;margin-bottom:20px}
.roles-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.role-badge{padding:6px 12px;border-radius:15px;font-size:11px;font-weight:800;text-transform:uppercase;border:1px solid var(--border);background:rgba(0,0,0,0.2)}
.btn-logout{display:block;width:100%;margin-top:20px;padding:14px;background:rgba(255,255,255,0.05);color:var(--text);border:1px solid var(--border);border-radius:6px;font-weight:800;text-transform:uppercase;text-decoration:none;transition:all .3s;text-align:center}
.btn-logout:hover{background:var(--accent);color:#000;border-color:var(--accent)}

/* Admin */
.admin-card h2{text-align:center;color:var(--accent);margin-bottom:20px;text-transform:uppercase;letter-spacing:2px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.admin-section{padding:20px;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:8px}
.admin-section h3{color:var(--text);margin-bottom:12px;font-size:14px;border-bottom:1px solid var(--border);padding-bottom:8px;text-transform:uppercase;letter-spacing:1px}
input,select,textarea{width:100%;padding:10px;margin-bottom:8px;background:var(--input-bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:inherit;font-size:13px}
button{width:100%;padding:10px;background:var(--accent);color:#000;border:none;border-radius:5px;font-weight:800;cursor:pointer;transition:all .3s;text-transform:uppercase;letter-spacing:1px;font-size:12px;margin-bottom:5px}
button:hover{background:#fff;box-shadow:0 0 15px var(--glow)}
button.danger{background:#ff4444;color:#fff}
button.danger:hover{background:#ff6666}
button.warning{background:#ffaa00;color:#000}
button.warning:hover{background:#ffcc44}

/* Search */
.search-results{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:5px;margin-bottom:10px;display:none;background:rgba(0,0,0,0.5)}
.search-item{display:flex;align-items:center;gap:10px;padding:8px;cursor:pointer;border-bottom:1px solid var(--border)}
.search-item:hover{background:rgba(0,229,255,0.1)}
.search-item img{width:30px;height:30px;border-radius:50%}
.search-item span{font-size:14px}
.selected-user{padding:10px;background:rgba(0,229,255,0.1);border:1px solid var(--accent);border-radius:5px;margin-bottom:10px;display:none;color:var(--accent);font-weight:bold;font-size:13px}
pre#resultBox{margin-top:20px;padding:15px;background:rgba(0,0,0,0.5);border:1px solid var(--border);border-radius:8px;font-size:12px;color:#00ffaa;max-height:200px;overflow-y:auto;display:none;white-space:pre-wrap}
.error-msg{text-align:center;color:#ff4444;margin-top:20px;font-weight:bold}
</style>
</head>
<body>

<div class="container">
    <div class="tabs" id="tabs" style="display:none;">
        <button class="tab-btn active" id="tabBtnProfile" onclick="switchTab('profile', this)">Profile</button>
        <button class="tab-btn" id="tabBtnAdmin" onclick="switchTab('admin', this); loadAdminData()" style="display:none;">Admin Panel</button>
    </div>

    <!-- PROFILE TAB -->
    <div id="profileTab" class="tab-content active">
        <div class="card profile-card" id="profileCard">
            <img id="avatar" class="avatar" src="" alt="Avatar">
            <div id="username" class="username">Loading...</div>
            <div id="userid" class="userid"></div>
            <div class="roles-grid" id="rolesGrid"></div>
            <a href="index.html" class="btn-logout">Logout / Return Home</a>
        </div>
    </div>

    <!-- ADMIN TAB -->
    <div id="adminTab" class="tab-content">
        <div class="card admin-card">
            <h2>Admin Control Center</h2>
            
            <!-- WYSZUKIWARKA -->
            <div style="margin-bottom:20px;background:rgba(0,0,0,0.2);padding:15px;border-radius:8px">
                <h3>1. Find User</h3>
                <input type="text" id="searchUserInput" placeholder="Type username (e.g. vex)" oninput="searchUsers()">
                <div id="searchResults" class="search-results"></div>
                <div id="selectedUserDisplay" class="selected-user"></div>
                <input type="hidden" id="selectedUserId">
            </div>

            <div class="admin-grid">
                <!-- MODERATION -->
                <div class="admin-section">
                    <h3>Moderation</h3>
                    <input type="text" id="modReason" placeholder="Reason">
                    <button onclick="adminAction('ban', {userId: getUserId(), reason: val('modReason')})" class="danger">Ban User</button>
                    <button onclick="adminAction('kick', {userId: getUserId(), reason: val('modReason')})" class="warning">Kick User</button>
                    <button onclick="adminAction('timeout', {userId: getUserId(), duration: 600000})" class="warning">Timeout 10m</button>
                    <button onclick="adminAction('unban', {userId: getUserId()})">Unban User</button>
                </div>

                <!-- MESSAGING -->
                <div class="admin-section">
                    <h3>Messaging</h3>
                    <textarea id="dmMessage" placeholder="Message for DM" rows="2"></textarea>
                    <button onclick="adminAction('dm', {userId: getUserId(), message: val('dmMessage')})">Send DM</button>
                    <select id="channelSelect"></select>
                    <textarea id="sayMessage" placeholder="Message for Channel" rows="2"></textarea>
                    <button onclick="adminAction('say', {channelId: val('channelSelect'), message: val('sayMessage')})">Send to Channel</button>
                </div>

                <!-- ROLES -->
                <div class="admin-section">
                    <h3>Role Management</h3>
                    <select id="roleSelect"></select>
                    <button onclick="adminAction('add_role', {userId: getUserId(), roleId: val('roleSelect')})">Add Role</button>
                    <button onclick="adminAction('remove_role', {userId: getUserId(), roleId: val('roleSelect')})" class="danger">Remove Role</button>
                </div>

                <!-- CHANNELS -->
                <div class="admin-section">
                    <h3>Channels</h3>
                    <select id="delChannelSelect"></select>
                    <button onclick="adminAction('delete_channel', {channelId: val('delChannelSelect')})" class="danger">Delete Channel</button>
                </div>
            </div>

            <pre id="resultBox"></pre>
            <a href="index.html" class="btn-logout">Logout / Return Home</a>
        </div>
    </div>
</div>

<script>
// ===== SETUP =====
document.documentElement.setAttribute('data-theme', localStorage.getItem('arch-theme') || 'dark');
const params = new URLSearchParams(window.location.search);
const dataBase64 = params.get('data');

function val(id) { return document.getElementById(id).value; }
function getUserId() { 
    const id = document.getElementById('selectedUserId').value;
    if (!id) { alert('Please search and select a user first!'); throw new Error('No user selected'); }
    return id; 
}

if (dataBase64) {
    try {
        const profile = JSON.parse(atob(dataBase64));
        document.getElementById('avatar').src = profile.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png';
        document.getElementById('username').textContent = profile.globalName;
        document.getElementById('userid').textContent = `ID: ${profile.id} | ${profile.email}`;

        const rolesGrid = document.getElementById('rolesGrid');
        if (profile.roles && profile.roles.length > 0) {
            profile.roles.forEach(r => {
                const hex = r.color === 0 ? '#8a93a6' : `#${r.color.toString(16).padStart(6, '0')}`;
                rolesGrid.innerHTML += `<span class="role-badge" style="border-color:${hex};color:${hex}">${r.name}</span>`;
            });
        } else {
            rolesGrid.innerHTML = '<span style="color:var(--text-dim);font-size:12px;">No roles</span>';
        }

        document.getElementById('tabs').style.display = 'flex';
        document.getElementById('profileCard').style.display = 'block';

        if (profile.isAdmin) {
            document.getElementById('tabBtnAdmin').style.display = 'block';
        }
    } catch (e) { 
        document.body.innerHTML = '<h1 class="error-msg">Error loading profile. Please login again.</h1>'; 
    }
} else {
    document.body.innerHTML = '<h1 class="error-msg">No login data. <a href="login.html" style="color:#00e5ff;">Login here</a>.</h1>';
}

function switchTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(name + 'Tab').classList.add('active');
    btn.classList.add('active');
}

// ===== WYSZUKIWANIE =====
let searchTimeout;
function searchUsers() {
    clearTimeout(searchTimeout);
    const query = val('searchUserInput');
    const resultsDiv = document.getElementById('searchResults');
    
    if (query.length < 2) { resultsDiv.style.display = 'none'; return; }

    searchTimeout = setTimeout(async () => {
        const res = await apiCall('search_users', { query });
        if (res.success && res.users.length > 0) {
            resultsDiv.innerHTML = res.users.map(u => `
                <div class="search-item" onclick="selectUser('${u.id}', '${u.username}')">
                    <img src="${u.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png'}">
                    <span>${u.username} ${u.displayName !== u.username ? `(${u.displayName})` : ''}</span>
                </div>
            `).join('');
            resultsDiv.style.display = 'block';
        } else {
            resultsDiv.innerHTML = '<div style="padding:10px;color:var(--text-dim);font-size:12px;">No users found.</div>';
            resultsDiv.style.display = 'block';
        }
    }, 400);
}

function selectUser(id, username) {
    document.getElementById('selectedUserId').value = id;
    const display = document.getElementById('selectedUserDisplay');
    display.textContent = `Selected: ${username} (${id})`;
    display.style.display = 'block';
    document.getElementById('searchResults').style.display = 'none';
    document.getElementById('searchUserInput').value = username;
}

// ===== ŁADOWANIE LIST =====
async function loadAdminData() {
    const chanRes = await apiCall('get_channels', {});
    if (chanRes.success) {
        document.getElementById('channelSelect').innerHTML = chanRes.channels.map(c => `<option value="${c.id}">#${c.name}</option>`).join('');
        document.getElementById('delChannelSelect').innerHTML = chanRes.channels.map(c => `<option value="${c.id}">#${c.name}</option>`).join('');
    }
    const roleRes = await apiCall('get_roles', {});
    if (roleRes.success) {
        document.getElementById('roleSelect').innerHTML = roleRes.roles.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
    }
}

// ===== API =====
async function apiCall(action, params) {
    const res = await fetch('/api/bot/admin_bot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, ...params })
    });
    return res.json();
}

async function adminAction(action, params) {
    const box = document.getElementById('resultBox');
    box.style.display = 'block';
    box.textContent = `Processing ${action}...`;
    try {
        const data = await apiCall(action, params);
        box.textContent = JSON.stringify(data, null, 2);
    } catch (e) { 
        box.textContent = 'Error: ' + e.message; 
    }
}
</script>
</body>
</html>
